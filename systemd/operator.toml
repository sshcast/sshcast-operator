# Sshcast Operator Console Configuration (/etc/sshcast/operator.toml)

# Fallback listen address when NOT using systemd socket activation (LISTEN_FDS).
# Under systemd, enable sshcast-operator.socket (/run/sshcast-operator/operator.sock for Nginx)
# and/or sshcast-operator-tcp@<port>.socket (127.0.0.1:<port>).
listen_addr = "unix:/run/sshcast-operator/operator.sock"

# Base URL path where the console is mounted behind Nginx
base_path = "/console"

# Default validity period in days for signed UserCert tokens (0 = never expires)
default_expires_days = 7

# SQLite state database path (defaults to $STATE_DIRECTORY/operator.db or /var/lib/sshcast-operator/operator.db)
# db_path = "/var/lib/sshcast-operator/operator.db"

# External base URL for GitHub OAuth callbacks (e.g. "https://sshcast.example.com")
# public_url = "https://sshcast.example.com"

# GitHub OAuth enrollment policy
auto_approve = true
min_github_account_age_days = 30

# GitHub OAuth App credentials (or set SSHCAST_GITHUB_CLIENT_ID / SSHCAST_GITHUB_CLIENT_SECRET in /etc/sysconfig/sshcast-operator)
# github_client_id = ""
# github_client_secret = ""

# Admin users allowed to sign in to /console/.
# Generate a bcrypt password hash with:
#   sshcast-operator --hash-password 'your-secret-password'
#
# [[users]]
# username = "admin"
# password_hash = "$2a$10$..."
